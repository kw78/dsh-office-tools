<svg xmlns="http://www.w3.org/2000/svg" width="780" height="240" viewBox="0 0 780 240" role="img" aria-label="dsh-office-tools demo: one prompt generates a quarterly-report trio">
  <rect x="0" y="0" width="780" height="240" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <!-- terminal title bar -->
  <circle cx="22" cy="22" r="6" fill="#ff5f57"/>
  <circle cx="42" cy="22" r="6" fill="#febc2e"/>
  <circle cx="62" cy="22" r="6" fill="#28c840"/>
  <text x="397" y="27" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#8b949e">dsh — profile web</text>
  <line x1="0" y1="40" x2="780" y2="40" stroke="#30363d" stroke-width="1"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5">
    <text x="24" y="66"><tspan fill="#3fb950">$</tspan><tspan fill="#e6edf3"> dsh --profile web</tspan></text>

    <text x="24" y="96"><tspan fill="#7ee787">&#10095;</tspan><tspan fill="#e6edf3"> generate the Q3 quarterly-report trio: report.docx, budget.xlsx, deck.pptx</tspan></text>

    <text x="24" y="128"><tspan fill="#3fb950">&#10004; word_create</tspan><tspan fill="#79c0ff">   report.docx</tspan><tspan fill="#8b949e">   8.7 kB</tspan><tspan fill="#e6edf3">   title &#183; paragraphs &#183; bullets &#183; table</tspan></text>

    <text x="24" y="154"><tspan fill="#3fb950">&#10004; excel_create</tspan><tspan fill="#79c0ff">  budget.xlsx</tspan><tspan fill="#8b949e">  17.2 kB</tspan><tspan fill="#e6edf3">   2 sheets &#183; =SUM and variance formulas</tspan></text>

    <text x="24" y="180"><tspan fill="#3fb950">&#10004; ppt_create</tspan><tspan fill="#79c0ff">   deck.pptx</tspan><tspan fill="#8b949e">    62.6 kB</tspan><tspan fill="#e6edf3">   4 slides &#183; speaker notes</tspan></text>

    <text x="24" y="214" fill="#8b949e" font-size="12.5">one prompt &#8594; three OOXML files &#183; workspace-confined &#183; no Word/Excel/PowerPoint process, pure JS</text>
  </g>
</svg>
