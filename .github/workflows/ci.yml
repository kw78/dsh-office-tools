name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '15 0 * * *'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # engines claims node >=20: test the declared floor and the current dev runtime
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      # Version comes from package.json's packageManager field (single
      # source of truth, pinned to the lockfile generator).
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check

  # Real-package composition E2E: boots a genuine cordis context from the
  # devDependency line (sandbox-policy + fs-sandbox + tools) and drives all
  # eight tools through the real write fence. The vitest doubles cannot catch
  # cross-package API drift (that is exactly how the 1.0.2 sandboxPolicy bug
  # slipped through) — this job can.
  real-composition:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dsh-version: ['0.1.2-rc.1', '0.2.0-rc.1']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install the target DSH line
        if: matrix.dsh-version != '0.1.2-rc.1'
        env:
          DSH_TARGET: ${{ matrix.dsh-version }}
        run: >-
          pnpm add -D @deepseek-ai/cordis@4.0.4 @deepseek-ai/dsh-agent@${DSH_TARGET}
          @deepseek-ai/dsh-fs@${DSH_TARGET} @deepseek-ai/dsh-fs-sandbox@${DSH_TARGET}
          @deepseek-ai/dsh-llm@${DSH_TARGET} @deepseek-ai/dsh-session@${DSH_TARGET}
          @deepseek-ai/dsh-sandbox@${DSH_TARGET} @deepseek-ai/dsh-sandbox-policy@${DSH_TARGET}
          @deepseek-ai/dsh-session-projection@${DSH_TARGET} @deepseek-ai/dsh-tools@${DSH_TARGET}
          --registry https://registry.npmjs.org
      - run: pnpm run check
      - run: pnpm run test:e2e

  # Forward-compatibility tripwire: the same E2E against the platform's
  # `next` dist-tag (ad-hoc override; lockfile changes are NOT committed —
  # this job only verifies compatibility ahead of a release).
  compat-next:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile --registry https://registry.npmjs.org
      - run: >-
          pnpm add -D @deepseek-ai/cordis@latest @deepseek-ai/dsh-fs@next @deepseek-ai/dsh-fs-sandbox@next
          @deepseek-ai/dsh-sandbox@next @deepseek-ai/dsh-sandbox-policy@next
          @deepseek-ai/dsh-session-projection@next @deepseek-ai/dsh-tools@next
          @deepseek-ai/dsh-agent@next @deepseek-ai/dsh-llm@next @deepseek-ai/dsh-session@next
          --registry https://registry.npmjs.org
      - run: pnpm run build
      - run: pnpm run test:e2e
