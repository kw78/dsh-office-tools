name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # engines claims node >=20: test the declared floor and the current dev runtime
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      # Version comes from package.json's packageManager field (single
      # source of truth, pinned to the lockfile generator).
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
